<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Data Structures & Memory Quiz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8; /* Sky Blue */
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
            --code-bg: #0f172a;
            --btn-hover: #334155;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 750px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 { color: var(--accent-color); margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6; }

        .screen { display: none; }
        .screen.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .code-container {
            background-color: var(--code-bg);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: left;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
            position: relative;
        }

        pre { margin: 0; }
        code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .btn-grid { grid-template-columns: 1fr 1fr; }
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 2px solid #334155;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        .btn:hover:not([disabled]) {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
        }

        .btn.correct {
            background-color: rgba(34, 197, 94, 0.1);
            border-color: var(--correct-color);
            color: var(--correct-color);
        }

        .btn.wrong {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--wrong-color);
            color: var(--wrong-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 24px;
            cursor: pointer;
        }
        
        .action-btn:hover { filter: brightness(1.1); }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(56, 189, 248, 0.1); /* Light blue bg */
            border-radius: 8px;
            font-size: 0.95rem;
            color: #e2e8f0;
            border-left: 4px solid var(--accent-color);
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen" class="screen active">
            <h1>C Memory & Structs</h1>
            <p>Ein praxisnahes Quiz über Heap, Stack, Linked Lists und Speicherverwaltung.<br>Keine Trickfragen, sondern wichtiges Wissen.</p>
            <button id="start-btn" class="action-btn">Starten</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="header">
                <span id="question-count">Frage 1 / 20</span>
                <span id="score">Punkte: 0</span>
            </div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            
            <div class="code-container">
                <pre><code id="code-snippet"></code></pre>
            </div>

            <h3 id="question-text">Frage...</h3>
            
            <div id="answer-buttons" class="btn-grid"></div>

            <div id="explanation" class="explanation"></div>
            
            <button id="next-btn" class="action-btn" style="display: none;">Weiter</button>
        </div>

        <div id="result-screen" class="screen">
            <h1>Auswertung</h1>
            <p>Du hast <strong id="final-score" style="color: var(--accent-color); font-size: 1.5rem;">0</strong> Fragen richtig beantwortet.</p>
            <p id="feedback-message"></p>
            <button id="restart-btn" class="action-btn">Neustart</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                code: `struct Node {
    int data;
    struct Node* next;
};
struct Node* head = malloc(sizeof(struct Node));`,
                question: "Wie greifst du korrekt auf das Feld 'data' zu?",
                answers: [
                    { text: "head.data", correct: false },
                    { text: "head->data", correct: true },
                    { text: "head::data", correct: false },
                    { text: "*head.data", correct: false }
                ],
                explanation: "Da 'head' ein Pointer ist, muss der Pfeil-Operator (->) verwendet werden. 'head.data' würde funktionieren, wenn head kein Pointer, sondern eine Struktur wäre."
            },
            {
                code: `int *ptr = malloc(10 * sizeof(int));
// ... Benutzung ...
free(ptr);`,
                question: "Welchen Wert hat 'ptr' direkt nach dem free()?",
                answers: [
                    { text: "NULL", correct: false },
                    { text: "0", correct: false },
                    { text: "Die alte Speicheradresse (Dangling Pointer)", correct: true },
                    { text: "Eine zufällige neue Adresse", correct: false }
                ],
                explanation: "free() gibt den Speicher frei, ändert aber den Wert der Pointer-Variable nicht. Der Pointer zeigt immer noch auf die (jetzt ungültige) Adresse."
            },
            {
                code: `void add_node(struct Node* head, int value) {
    struct Node* current = head;
    while (current->next != NULL) {
        current = current->next;
    }
    // Einfügen ...
}`,
                question: "Was macht dieser Code-Schnipsel?",
                answers: [
                    { text: "Sucht den Anfang der Liste", correct: false },
                    { text: "Löscht alle Elemente", correct: false },
                    { text: "Traversiert bis zum letzten Knoten", correct: true },
                    { text: "Erzeugt eine Endlosschleife", correct: false }
                ],
                explanation: "Die Schleife läuft solange, bis ein Knoten keinen Nachfolger mehr hat (next == NULL). Das ist typisch, um etwas am Ende anzufügen."
            },
            {
                code: `int *arr = malloc(5 * sizeof(int));
arr[0] = 10;
arr = realloc(arr, 10 * sizeof(int));`,
                question: "Was passiert beim realloc?",
                answers: [
                    { text: "Löscht den Inhalt und erstellt neues Array", correct: false },
                    { text: "Vergrößert den Block, behält alte Daten (10) bei", correct: true },
                    { text: "Erstellt zweiten Block, arr zeigt auf beide", correct: false },
                    { text: "Gibt NULL zurück, wenn vergrößert wird", correct: false }
                ],
                explanation: "realloc versucht, den Speicherblock zu vergrößern. Falls nötig, kopiert es die Daten an eine neue Stelle. Die alten Daten (hier die 10) bleiben erhalten."
            },
            {
                code: `int a = 50;
int *p = &a;
int **pp = &p;`,
                question: "Wie greift man über 'pp' auf den Wert 50 zu?",
                answers: [
                    { text: "**pp", correct: true },
                    { text: "*pp", correct: false },
                    { text: "&pp", correct: false },
                    { text: "pp->pp", correct: false }
                ],
                explanation: "pp ist ein Pointer auf einen Pointer. Einmal dereferenzieren (*pp) gibt uns 'p'. Zweimal dereferenzieren (**pp) gibt uns 'a' (50)."
            },
            {
                code: `void func() {
    int x = 10;
    return &x; // Fehler!
}`,
                question: "Warum ist das ein schwerer Fehler?",
                answers: [
                    { text: "Syntaxfehler", correct: false },
                    { text: "Man darf keine Adressen zurückgeben", correct: false },
                    { text: "x liegt auf dem Stack und wird beim Return gelöscht", correct: true },
                    { text: "x müsste malloc nutzen", correct: false }
                ],
                explanation: "Lokale Variablen (Stack) existieren nur innerhalb der Funktion. Gibt man ihre Adresse zurück, zeigt der Pointer auf ungültigen Speicher."
            },
            {
                code: `struct Node { int val; struct Node* next; };
struct Node* n1 = malloc(sizeof(struct Node));
struct Node* n2 = malloc(sizeof(struct Node));
n1->next = n2;
free(n1);`,
                question: "Was ist das Problem hier (Memory Leak)?",
                answers: [
                    { text: "n1 wurde nicht korrekt gefreit", correct: false },
                    { text: "Der Zugriff auf n2 ist verloren (Leak)", correct: true },
                    { text: "n2 wird automatisch mitgelöscht", correct: false },
                    { text: "Gar keines", correct: false }
                ],
                explanation: "Wenn n1 gelöscht wird, existiert der Zeiger 'next' nicht mehr. Wir haben keine Möglichkeit mehr, n2 zu erreichen oder zu free-en."
            },
            {
                code: `int matrix[10][10];`,
                question: "Wo liegt dieser Speicher normalerweise?",
                answers: [
                    { text: "Auf dem Heap", correct: false },
                    { text: "Auf dem Stack (oder global)", correct: true },
                    { text: "Auf der Festplatte", correct: false },
                    { text: "Im Read-Only Speicher", correct: false }
                ],
                explanation: "Arrays mit fester Größe, die innerhalb einer Funktion deklariert werden, liegen auf dem Stack. Große Arrays können den Stack sprengen (Stack Overflow)."
            },
            {
                code: `char *s1 = "Hello";
char s2[] = "Hello";`,
                question: "Was ist der Hauptunterschied?",
                answers: [
                    { text: "s1 ist änderbar, s2 nicht", correct: false },
                    { text: "s1 liegt im Read-Only Bereich, s2 ist eine Kopie auf dem Stack", correct: true },
                    { text: "Kein Unterschied", correct: false },
                    { text: "s2 ist ein Pointer, s1 ein Array", correct: false }
                ],
                explanation: "s1 ist ein Zeiger auf ein String-Literal (oft Read-Only). s2 ist ein echtes Array auf dem Stack, dessen Inhalt wir verändern dürfen."
            },
            {
                code: `typedef struct {
    int id;
    char name[20];
} User;`,
                question: "Warum nutzt man 'typedef' hier?",
                answers: [
                    { text: "Macht den Code schneller", correct: false },
                    { text: "Erlaubt 'User x' statt 'struct User x' zu schreiben", correct: true },
                    { text: "Spart Speicherplatz", correct: false },
                    { text: "Ist in C zwingend erforderlich", correct: false }
                ],
                explanation: "Typedef erstellt einen Alias. Ohne typedef müsste man in C immer 'struct User' schreiben, um eine Variable zu deklarieren."
            },
            {
                code: `void swap(int *a, int *b) {
    int temp = *a;
    *a = *b;
    *b = temp;
}`,
                question: "Dies ist 'Call by ...'?",
                answers: [
                    { text: "Value", correct: false },
                    { text: "Reference (simuliert durch Pointer)", correct: true },
                    { text: "Name", correct: false },
                    { text: "Constant", correct: false }
                ],
                explanation: "In C gibt es technisch nur Call-by-Value (die Adresse wird kopiert), aber wir nutzen Pointer, um das Verhalten von Call-by-Reference zu erreichen und die Originaldaten zu ändern."
            },
            {
                code: `struct List {
    int val;
    struct List *next;
};
// Einfügen am Anfang (Head update)`,
                question: "Welche Reihenfolge ist korrekt für 'new_node'?",
                answers: [
                    { text: "head = new_node; new_node->next = head;", correct: false },
                    { text: "new_node->next = head; head = new_node;", correct: true },
                    { text: "new_node->next = NULL; head = new_node;", correct: false },
                    { text: "Reihenfolge ist egal", correct: false }
                ],
                explanation: "Zuerst muss der neue Knoten auf den alten Kopf zeigen. Erst DANN darf man den Kopf-Zeiger auf den neuen Knoten umbiegen, sonst verliert man die Liste."
            },
            {
                code: `int *p = NULL;
if (p) { ... }`,
                question: "Wann wird der Block ausgeführt?",
                answers: [
                    { text: "Wenn p gleich NULL ist", correct: false },
                    { text: "Wenn p NICHT NULL ist (also gültig sein könnte)", correct: true },
                    { text: "Immer", correct: false },
                    { text: "Nie, führt zu Crash", correct: false }
                ],
                explanation: "In C ist NULL äquivalent zu 0 (false). Jeder andere Zeigerwert ist true. Das ist der Standard-Check, ob ein Pointer initialisiert ist."
            },
            {
                code: `void *ptr;`,
                question: "Was ist ein void-Pointer?",
                answers: [
                    { text: "Ein Pointer auf nichts", correct: false },
                    { text: "Ein generischer Pointer, der auf jeden Datentyp zeigen kann", correct: true },
                    { text: "Ein Fehler im Code", correct: false },
                    { text: "Ein Pointer, der 0 Byte groß ist", correct: false }
                ],
                explanation: "void* wird für generische Funktionen genutzt (z.B. malloc gibt void* zurück). Man kann ihn aber nicht direkt dereferenzieren, man muss ihn erst casten."
            },
            {
                code: `int *arr = malloc(100 * sizeof(int));
// Wir brauchen arr nicht mehr`,
                question: "Was passiert, wenn wir free(arr) vergessen?",
                answers: [
                    { text: "Der Speicher wird sofort freigegeben", correct: false },
                    { text: "Memory Leak (Speicher bleibt belegt bis Programmende)", correct: true },
                    { text: "Stack Overflow", correct: false },
                    { text: "Compiler Warnung", correct: false }
                ],
                explanation: "Der Speicher bleibt für das Betriebssystem als 'belegt' markiert, obwohl das Programm ihn nicht mehr nutzt. Bei Langläufern (Servern) führt das zum Absturz."
            },
            {
                code: `struct Node *current = head;
while(current != NULL) {
    free(current);
    current = current->next; // <--- Hier
}`,
                question: "Was ist der Fehler in dieser Lösch-Logik?",
                answers: [
                    { text: "Kein Fehler", correct: false },
                    { text: "Use-after-free: current wurde gelöscht, dann wird current->next gelesen", correct: true },
                    { text: "Man darf structs nicht free-en", correct: false },
                    { text: "Endlosschleife", correct: false }
                ],
                explanation: "Sobald `free(current)` ausgeführt wurde, darf man `current->next` nicht mehr lesen. Man muss den Next-Zeiger in einer temporären Variable speichern, *bevor* man löscht."
            },
            {
                code: `const int *p;`,
                question: "Was bedeutet diese Deklaration?",
                answers: [
                    { text: "Der Pointer p darf nicht geändert werden", correct: false },
                    { text: "Der Wert, auf den p zeigt, ist read-only", correct: true },
                    { text: "Beides ist konstant", correct: false },
                    { text: "p ist ein Integer", correct: false }
                ],
                explanation: "Lies es von rechts nach links: 'p is a pointer to an int that is const'. Man kann p woanders hinzeigen lassen, aber den Wert `*p` nicht ändern."
            },
            {
                code: `FILE *f = fopen("data.txt", "r");
if (f == NULL) {
    perror("Error");
}`,
                question: "Warum prüft man auf NULL?",
                answers: [
                    { text: "Weil 'r' für Read steht", correct: false },
                    { text: "Um zu prüfen, ob die Datei erfolgreich geöffnet wurde", correct: true },
                    { text: "Das ist unnötig", correct: false },
                    { text: "Weil Dateien immer NULL enden", correct: false }
                ],
                explanation: "Wenn die Datei nicht existiert oder keine Rechte vorhanden sind, gibt fopen NULL zurück. Ohne Prüfung würde der nächste Zugriff (fscanf etc.) crashen."
            },
            {
                code: `struct Data {
    int id;
    struct Data sub; // Rekursive Struktur ohne Pointer
};`,
                question: "Ist das erlaubt?",
                answers: [
                    { text: "Ja, ganz normal", correct: false },
                    { text: "Nein, unendliche Größe (Compiler Error)", correct: true },
                    { text: "Nur wenn id static ist", correct: false },
                    { text: "Ja, aber nur im Heap", correct: false }
                ],
                explanation: "Eine Struktur kann keine Instanz von sich selbst enthalten (wie groß wäre sie?). Sie muss einen *Pointer* auf sich selbst enthalten (`struct Data *sub`)."
            },
            {
                code: `size_t len = strlen("Hallo");`,
                question: "Welchen Wert hat len?",
                answers: [
                    { text: "6 (wegen Null-Terminator)", correct: false },
                    { text: "5", correct: true },
                    { text: "4", correct: false },
                    { text: "Unbekannt", correct: false }
                ],
                explanation: "strlen zählt die Zeichen bis (aber exklusive) des Null-Terminators. sizeof(\"Hallo\") wäre 6, aber strlen ist 5."
            }
        ];

        // --- GAME LOGIC ---

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContainer = document.getElementById('question-text');
        const answerButtonsElement = document.getElementById('answer-buttons');
        const codeSnippetElement = document.getElementById('code-snippet');
        const nextButton = document.getElementById('next-btn');
        const progressElement = document.getElementById('progress');
        const scoreElement = document.getElementById('score');
        const questionCountElement = document.getElementById('question-count');
        const explanationElement = document.getElementById('explanation');

        let shuffledQuestions, currentQuestionIndex;
        let score = 0;

        document.getElementById('start-btn').addEventListener('click', startQuiz);
        nextButton.addEventListener('click', () => {
            currentQuestionIndex++;
            setNextQuestion();
        });
        document.getElementById('restart-btn').addEventListener('click', startQuiz);

        function startQuiz() {
            startScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            quizScreen.classList.add('active');
            
            // Randomize Questions
            shuffledQuestions = questions.sort(() => Math.random() - .5);
            currentQuestionIndex = 0;
            score = 0;
            updateScore();
            setNextQuestion();
        }

        function setNextQuestion() {
            resetState();
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion(shuffledQuestions[currentQuestionIndex]);
                updateProgress();
            } else {
                showResults();
            }
        }

        function showQuestion(question) {
            questionCountElement.innerText = `FRAGE ${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
            codeSnippetElement.innerText = question.code;
            questionContainer.innerText = question.question;
            
            question.answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('btn');
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener('click', selectAnswer);
                answerButtonsElement.appendChild(button);
            });
        }

        function resetState() {
            nextButton.style.display = 'none';
            explanationElement.style.display = 'none';
            explanationElement.innerText = '';
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedButton = e.target;
            const correct = selectedButton.dataset.correct === "true";
            
            if(correct) {
                score++;
                updateScore();
            }

            setStatusClass(selectedButton, correct);
            
            Array.from(answerButtonsElement.children).forEach(button => {
                setStatusClass(button, button.dataset.correct === "true");
                button.disabled = true;
            });

            // Show explanation
            explanationElement.innerHTML = "<strong>Erklärung:</strong> " + shuffledQuestions[currentQuestionIndex].explanation;
            explanationElement.style.display = 'block';

            nextButton.style.display = 'block';
        }

        function setStatusClass(element, correct) {
            element.classList.remove('correct');
            element.classList.remove('wrong');
            if (correct) {
                element.classList.add('correct');
            } else {
                element.classList.add('wrong');
            }
        }

        function updateProgress() {
            const progressPercent = ((currentQuestionIndex) / shuffledQuestions.length) * 100;
            progressElement.style.width = `${progressPercent}%`;
        }

        function updateScore() {
            scoreElement.innerText = `PUNKTE: ${score}`;
        }

        function showResults() {
            quizScreen.classList.remove('active');
            resultScreen.classList.add('active');
            
            document.getElementById('final-score').innerText = score;
            
            const feedback = document.getElementById('feedback-message');
            const percent = (score / shuffledQuestions.length) * 100;
            
            if(percent === 100) feedback.innerText = "Perfekt! Du verstehst Speicherverwaltung exzellent.";
            else if(percent >= 80) feedback.innerText = "Sehr stark! Du bist sicher im Umgang mit Pointern.";
            else if(percent >= 50) feedback.innerText = "Gute Basis. Schau dir Linked Lists und Malloc nochmal an.";
            else feedback.innerText = "Nicht aufgeben! Speicherverwaltung in C ist schwer. Übe weiter.";
        }
    </script>
</body>
</html>
