<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Masterclass Quiz (40 Questions)</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #e94560;
            --text-secondary: #a2a8d3;
            --accent-color: #e94560;
            --correct-color: #0f3460;
            --correct-border: #4caf50;
            --wrong-color: #2a1b1b;
            --wrong-border: #f44336;
            --btn-bg: #0f3460;
            --btn-hover: #533483;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            text-align: center;
            border: 1px solid #0f3460;
        }

        h1 { color: var(--text-primary); margin-bottom: 0.5rem; letter-spacing: 1px; }
        p { color: var(--text-secondary); margin-bottom: 1.5rem; }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .code-container {
            background-color: #000;
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--accent-color);
            font-family: 'Consolas', monospace;
            color: #dcdcdc;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        @media (min-width: 600px) { .btn-grid { grid-template-columns: 1fr 1fr; } }

        .btn {
            background-color: var(--btn-bg);
            color: #fff;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .btn:hover:not([disabled]) { background-color: var(--btn-hover); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.7; cursor: default; }

        .btn.correct { background-color: var(--correct-color); border-color: var(--correct-border); }
        .btn.wrong { background-color: var(--wrong-color); border-color: var(--wrong-border); }

        .action-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }
        .action-btn:hover { filter: brightness(1.1); }

        .header { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-secondary); font-size: 0.9rem; }
        .progress-bar { width: 100%; height: 6px; background: #0f3460; border-radius: 3px; margin-bottom: 20px; }
        .progress { height: 100%; background: var(--accent-color); width: 0%; transition: width 0.3s; }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(233, 69, 96, 0.1);
            border-radius: 6px;
            font-size: 0.9rem;
            color: #e0e0e0;
            display: none;
            text-align: left;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen active">
        <h1>C Masterclass Quiz</h1>
        <p>40 Fragen. Von Structs bis Bit-Manipulation.<br>Bist du bereit für den Marathon?</p>
        <button id="start-btn" class="action-btn">Quiz starten</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="header">
            <span id="question-count">Frage 1 / 40</span>
            <span id="score">Score: 0</span>
        </div>
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        
        <div class="code-container"><pre><code id="code-snippet"></code></pre></div>
        <h3 id="question-text"></h3>
        <div id="answer-buttons" class="btn-grid"></div>
        <div id="explanation" class="explanation"></div>
        <button id="next-btn" class="action-btn" style="display: none;">Nächste Frage</button>
    </div>

    <div id="result-screen" class="screen">
        <h1>Ergebnis</h1>
        <p>Du hast <strong id="final-score" style="color: var(--accent-color);">0</strong> von 40 Punkten.</p>
        <p id="feedback-message"></p>
        <button id="restart-btn" class="action-btn">Neustart</button>
    </div>
</div>

<script>
const questions = [
    {
        code: `union Data { int i; float f; char str[20]; };
union Data data;
data.i = 10;
data.f = 220.5;
strcpy(data.str, "C Prog");`,
        question: "Welchen Wert hat 'data.i' am Ende?",
        answers: [
            { text: "10", correct: false },
            { text: "220", correct: false },
            { text: "Garbage (überschrieben)", correct: true },
            { text: "Compiler Error", correct: false }
        ],
        explanation: "In einer Union teilen sich alle Member denselben Speicherplatz. Das Schreiben von `data.str` überschreibt `data.i` und `data.f`."
    },
    {
        code: `int x = 5;
if (x = 0) { printf("A"); }
else { printf("B"); }`,
        question: "Was wird ausgegeben?",
        answers: [
            { text: "A", correct: false },
            { text: "B", correct: true },
            { text: "Compiler Error", correct: false },
            { text: "Nichts", correct: false }
        ],
        explanation: "Achtung: `x = 0` ist eine Zuweisung, kein Vergleich! Der Ausdruck ergibt 0 (false), also wird der Else-Zweig ausgeführt."
    },
    {
        code: `void func() {
    static int i = 0;
    i++;
    printf("%d", i);
}
// func wird 3x aufgerufen`,
        question: "Was ist der Output?",
        answers: [
            { text: "1 1 1", correct: false },
            { text: "1 2 3", correct: true },
            { text: "0 1 2", correct: false },
            { text: "0 0 0", correct: false }
        ],
        explanation: "Statische lokale Variablen behalten ihren Wert zwischen Funktionsaufrufen und werden nur einmal initialisiert."
    },
    {
        code: `int *ptr;
*ptr = 10;`,
        question: "Was ist das Problem?",
        answers: [
            { text: "ptr ist nicht initialisiert (SegFault)", correct: true },
            { text: "Syntax Fehler", correct: false },
            { text: "Man kann 10 nicht zuweisen", correct: false },
            { text: "Kein Problem", correct: false }
        ],
        explanation: "Der Pointer `ptr` zeigt irgendwohin (zufällig). Das Dereferenzieren und Schreiben führt fast sicher zum Absturz."
    },
    {
        code: `FILE *fp = fopen("test.txt", "r");
fseek(fp, 0, SEEK_END);
long size = ftell(fp);`,
        question: "Was bewirkt dieser Code?",
        answers: [
            { text: "Löscht die Datei", correct: false },
            { text: "Liest die erste Zeile", correct: false },
            { text: "Ermittelt die Dateigröße in Bytes", correct: true },
            { text: "Geht zum Anfang der Datei", correct: false }
        ],
        explanation: "Wir springen ans Ende (`SEEK_END`) und fragen dann die Position ab (`ftell`). Das entspricht der Dateigröße."
    },
    {
        code: `int a = 10;
void *p = &a;
(*(int*)p)++;
printf("%d", a);`,
        question: "Was ist a?",
        answers: [
            { text: "10", correct: false },
            { text: "11", correct: true },
            { text: "Garbage", correct: false },
            { text: "Compiler Error", correct: false }
        ],
        explanation: "Cast zu int*, dereferenzieren, dann inkrementieren. `a` wird 11."
    },
    {
        code: `enum Days { MON, TUE, WED=5, THU };
printf("%d", THU);`,
        question: "Was ist der Wert von THU?",
        answers: [
            { text: "3", correct: false },
            { text: "6", correct: true },
            { text: "4", correct: false },
            { text: "0", correct: false }
        ],
        explanation: "Enums zählen hoch. MON=0, TUE=1, WED=5 (explizit), THU=6."
    },
    {
        code: `char *s = "Hello";
char p[] = "Hello";
printf("%d", sizeof(s) == sizeof(p));`,
        question: "Angenommen 64-bit System. Ist die Ausgabe 1 (True) oder 0 (False)?",
        answers: [
            { text: "1 (Gleich)", correct: false },
            { text: "0 (Ungleich)", correct: true },
            { text: "Compiler Error", correct: false },
            { text: "Undefined", correct: false }
        ],
        explanation: "`sizeof(s)` ist Pointergröße (8 Byte). `sizeof(p)` ist Arraygröße inkl. Nullterminator (6 Byte)."
    },
    {
        code: `int x = 5, y = 2;
float f = x / y;`,
        question: "Welchen Wert hat f?",
        answers: [
            { text: "2.5", correct: false },
            { text: "2.0", correct: true },
            { text: "3.0", correct: false },
            { text: "Compiler Warnung", correct: false }
        ],
        explanation: "Integer-Division! 5 / 2 ergibt 2 (Rest verfällt). Erst danach wird die 2 in 2.0 (float) umgewandelt."
    },
    {
        code: `volatile int sensor_value;`,
        question: "Was sagt 'volatile' dem Compiler?",
        answers: [
            { text: "Variable ist konstant", correct: false },
            { text: "Variable darf nicht optimiert/gecached werden", correct: true },
            { text: "Variable liegt im Register", correct: false },
            { text: "Variable ist thread-safe", correct: false }
        ],
        explanation: "`volatile` verhindert, dass der Compiler Lesezugriffe wegoptimiert, da sich der Wert jederzeit von außen (Hardware/Interrupt) ändern kann."
    },
    {
        code: `int arr[3] = {1, 2, 3};
printf("%d", 2[arr]);`,
        question: "Funktioniert das?",
        answers: [
            { text: "Nein, Syntaxfehler", correct: false },
            { text: "Ja, gibt 3 aus", correct: true },
            { text: "Ja, gibt 2 aus", correct: false },
            { text: "Nein, Segfault", correct: false }
        ],
        explanation: "Array-Indizierung `a[b]` ist definiert als `*(a + b)`. Das ist kommutativ, also ist `*(b + a)` oder `b[a]` identisch."
    },
    {
        code: `#define MAX 100
#ifdef MAX
  // Code A
#else
  // Code B
#endif`,
        question: "Welcher Code wird kompiliert?",
        answers: [
            { text: "Code A", correct: true },
            { text: "Code B", correct: false },
            { text: "Beide", correct: false },
            { text: "Keiner", correct: false }
        ],
        explanation: "`#ifdef MAX` prüft, ob das Makro definiert ist. Da es definiert ist, wird Code A genutzt."
    },
    {
        code: `unsigned char c = 256;`,
        question: "Welchen Wert hat c?",
        answers: [
            { text: "256", correct: false },
            { text: "0", correct: true },
            { text: "1", correct: false },
            { text: "Undefined", correct: false }
        ],
        explanation: "Unsigned char (meist 8 bit) geht von 0-255. 256 ist binär `100000000`. Die unteren 8 Bits sind alle 0 (Overflow)."
    },
    {
        code: `int (*func_ptr)(int, int);`,
        question: "Was wird hier deklariert?",
        answers: [
            { text: "Eine Funktion, die int zurückgibt", correct: false },
            { text: "Ein Pointer auf eine Funktion", correct: true },
            { text: "Ein Array von Integern", correct: false },
            { text: "Ein Funktionsaufruf", correct: false }
        ],
        explanation: "Das ist die Syntax für einen Function Pointer, der zwei Ints nimmt und einen Int zurückgibt."
    },
    {
        code: `int main(int argc, char *argv[])`,
        question: "Was steht in argv[0] normalerweise?",
        answers: [
            { text: "Das erste Argument", correct: false },
            { text: "Der Name des Programms", correct: true },
            { text: "NULL", correct: false },
            { text: "Anzahl der Argumente", correct: false }
        ],
        explanation: "argv[0] enthält den Pfad/Namen der ausführbaren Datei. Echte Argumente starten bei argv[1]."
    },
    {
        code: `int x = 10;
{
    int x = 20;
    printf("%d", x);
}`,
        question: "Was ist der Output?",
        answers: [
            { text: "10", correct: false },
            { text: "20", correct: true },
            { text: "Compiler Error (Redefinition)", correct: false },
            { text: "30", correct: false }
        ],
        explanation: "Shadowing: Die innere Variable `x` verdeckt die äußere Variable im Scope des Blocks."
    },
    {
        code: `struct Point { int x, y; };
struct Point p = { .y = 2, .x = 1 };`,
        question: "Ist diese Initialisierung erlaubt (C99)?",
        answers: [
            { text: "Nein, Reihenfolge falsch", correct: false },
            { text: "Ja, Designated Initializer", correct: true },
            { text: "Nein, nur in C++", correct: false },
            { text: "Nur für globale Variablen", correct: false }
        ],
        explanation: "Mit Designated Initializers kann man Member explizit benennen, die Reihenfolge ist dann egal."
    },
    {
        code: `int x = 1;
switch(x) {
    case 1: int y = 5; break;
}`,
        question: "Kompiliert das (C89/C90)?",
        answers: [
            { text: "Ja", correct: false },
            { text: "Nein, Deklaration nach Label", correct: true },
            { text: "Ja, aber Warnung", correct: false },
            { text: "Nur mit -O2", correct: false }
        ],
        explanation: "In altem C (C89) darf direkt nach einem Label (`case 1:`) keine Deklaration folgen. Man müsste einen Block `{}` setzen."
    },
    {
        code: `char buff[10];
fgets(buff, 10, stdin);`,
        question: "Ist das sicher vor Buffer Overflows?",
        answers: [
            { text: "Nein, fgets ist unsicher", correct: false },
            { text: "Ja, Länge ist begrenzt", correct: true },
            { text: "Nein, nutzt gets() intern", correct: false },
            { text: "Nur unter Linux", correct: false }
        ],
        explanation: "`fgets` ist sicher, weil man die maximale Puffergröße angibt. `gets` (ohne f) ist die unsichere Variante."
    },
    {
        code: `int x = 5; // 0101 binary
int y = x << 2;`,
        question: "Was ist y?",
        answers: [
            { text: "10", correct: false },
            { text: "20", correct: true },
            { text: "7", correct: false },
            { text: "25", correct: false }
        ],
        explanation: "Shift Left um 2 entspricht mal 4. 5 * 4 = 20. Binär: 0101 -> 10100."
    },
    {
        code: `printf("%%d", 10);`,
        question: "Was wird ausgegeben?",
        answers: [
            { text: "10", correct: false },
            { text: "%d", correct: true },
            { text: "%10", correct: false },
            { text: "Error", correct: false }
        ],
        explanation: "`%%` ist das Escape-Zeichen, um ein Prozentzeichen zu drucken. Das Argument 10 wird ignoriert."
    },
    {
        code: `int *p = malloc(0);`,
        question: "Was gibt malloc(0) zurück?",
        answers: [
            { text: "Immer NULL", correct: false },
            { text: "Compiler Error", correct: false },
            { text: "Implementation Defined (NULL oder unique pointer)", correct: true },
            { text: "Einen Pointer auf 1 Byte", correct: false }
        ],
        explanation: "Der Standard definiert es nicht strikt. Es kann NULL sein oder ein Pointer, der free() übergeben werden kann."
    },
    {
        code: `extern int count;`,
        question: "Was bedeutet das?",
        answers: [
            { text: "Erstellt Variable count", correct: false },
            { text: "Deklariert count (definiert woanders)", correct: true },
            { text: "Count ist konstant", correct: false },
            { text: "Count ist privat", correct: false }
        ],
        explanation: "Extern sagt dem Compiler: 'Diese Variable existiert in einer anderen Datei, ich nutze sie nur'."
    },
    {
        code: `char c = 'A' + 1;`,
        question: "Welcher Buchstabe ist c?",
        answers: [
            { text: "A1", correct: false },
            { text: "B", correct: true },
            { text: "Compiler Error", correct: false },
            { text: "Undefined", correct: false }
        ],
        explanation: "Chars sind intern Integer (ASCII). 'A' ist 65. 65+1 = 66 = 'B'."
    },
    {
        code: `int a = 5, b = 5;
printf("%d", a++ + ++b);`,
        question: "Output?",
        answers: [
            { text: "10", correct: false },
            { text: "12", correct: false },
            { text: "11", correct: true },
            { text: "13", correct: false }
        ],
        explanation: "`a++` gibt 5 zurück (dann a=6). `++b` erhöht erst (b=6) und gibt 6 zurück. 5 + 6 = 11."
    },
    {
        code: `struct Node { struct Node *next; };`,
        question: "Dies ist eine...",
        answers: [
            { text: "Selbstreferenzierende Struktur", correct: true },
            { text: "Rekursive Funktion", correct: false },
            { text: "Ungültige Deklaration", correct: false },
            { text: "Nested Class", correct: false }
        ],
        explanation: "Standard für Linked Lists, Trees, etc."
    },
    {
        code: `strcmp("ABC", "ABC");`,
        question: "Was ist das Ergebnis?",
        answers: [
            { text: "1 (True)", correct: false },
            { text: "0", correct: true },
            { text: "-1", correct: false },
            { text: "Pointer Differenz", correct: false }
        ],
        explanation: "`strcmp` gibt 0 zurück, wenn die Strings identisch sind."
    },
    {
        code: `int x = 10;
void foo() { int x = 5; }
// in main: printf("%d", x);`,
        question: "Was gibt main aus?",
        answers: [
            { text: "5", correct: false },
            { text: "10", correct: true },
            { text: "0", correct: false },
            { text: "Garbage", correct: false }
        ],
        explanation: "Die Änderung in `foo` betrifft nur die lokale Variable dort. Das globale oder main-lokale x bleibt unberührt."
    },
    {
        code: `int arr[] = {1};`,
        question: "Wo liegt arr, wenn es in main deklariert ist?",
        answers: [
            { text: "Stack", correct: true },
            { text: "Heap", correct: false },
            { text: "Data Segment", correct: false },
            { text: "Register", correct: false }
        ],
        explanation: "Lokale Variablen (automatische Speicherdauer) landen auf dem Stack."
    },
    {
        code: `free(NULL);`,
        question: "Was passiert?",
        answers: [
            { text: "Crash (SegFault)", correct: false },
            { text: "Nichts (Sicher)", correct: true },
            { text: "Compiler Error", correct: false },
            { text: "Memory Leak", correct: false }
        ],
        explanation: "Der C-Standard garantiert, dass `free(NULL)` keine Operation durchführt (no-op)."
    },
    {
        code: `int x = -1;
unsigned int y = 1;
if(x < y) printf("True"); else printf("False");`,
        question: "Output?",
        answers: [
            { text: "True", correct: false },
            { text: "False", correct: true },
            { text: "Error", correct: false },
            { text: "Random", correct: false }
        ],
        explanation: "Klassische Falle. Signed Int wird zu Unsigned 'promoted'. -1 wird zu MAX_UINT, was größer als 1 ist."
    },
    {
        code: `const int * const p;`,
        question: "Was ist konstant?",
        answers: [
            { text: "Nur der Pointer", correct: false },
            { text: "Nur der Wert", correct: false },
            { text: "Pointer UND Wert", correct: true },
            { text: "Nichts", correct: false }
        ],
        explanation: "Pointer ist const (`* const p`), und das Ziel ist const (`const int *`). Man kann weder p ändern noch *p."
    },
    {
        code: `int x = 10;
x = x++;`,
        question: "Verhalten?",
        answers: [
            { text: "x wird 11", correct: false },
            { text: "x bleibt 10", correct: false },
            { text: "Undefined Behavior", correct: true },
            { text: "Compiler Error", correct: false }
        ],
        explanation: "Variable `x` wird im gleichen Ausdruck verändert (Zuweisung und Inkrement) ohne Sequence Point. Das Ergebnis ist undefiniert."
    },
    {
        code: `#include <stdio.h>
// Kein main()`,
        question: "Kann man das kompilieren?",
        answers: [
            { text: "Ja, zu Object File (.o)", correct: true },
            { text: "Ja, zu Executable (.exe)", correct: false },
            { text: "Nein, nie", correct: false },
            { text: "Nur Header Files", correct: false }
        ],
        explanation: "Man kann Code ohne main kompilieren (z.B. für eine Library), aber nicht linken zu einer ausführbaren Datei."
    },
    {
        code: `int (*arr)[10];`,
        question: "Was ist arr?",
        answers: [
            { text: "Array aus 10 Pointern", correct: false },
            { text: "Pointer auf Array von 10 Ints", correct: true },
            { text: "Funktionspointer", correct: false },
            { text: "Array von 10 Ints", correct: false }
        ],
        explanation: "Klammern sind wichtig! `*arr[10]` wäre Array von Pointern. `(*arr)[10]` ist ein Pointer auf ein ganzes Array."
    },
    {
        code: `float f = 3.14;
int i = (int)f;`,
        question: "Welchen Wert hat i?",
        answers: [
            { text: "3", correct: true },
            { text: "4 (gerundet)", correct: false },
            { text: "0", correct: false },
            { text: "Undefined", correct: false }
        ],
        explanation: "Cast von Float zu Int schneidet die Nachkommastellen einfach ab (Truncation)."
    },
    {
        code: `~0`,
        question: "Was ergibt das (binäres NOT von 0)?",
        answers: [
            { text: "0", correct: false },
            { text: "1", correct: false },
            { text: "-1 (bei Two's Complement)", correct: true },
            { text: "Max Int", correct: false }
        ],
        explanation: "Alle Bits werden 1. Im Zweierkomplement steht 'alle Bits 1' für -1."
    },
    {
        code: `register int i;`,
        question: "Was bewirkt register?",
        answers: [
            { text: "Zwingt Variable in CPU Register", correct: false },
            { text: "Hinweis an Compiler, Register zu nutzen", correct: true },
            { text: "Macht Variable global", correct: false },
            { text: "Nichts in modernem C", correct: false }
        ],
        explanation: "Es ist nur ein Hinweis. Moderne Compiler ignorieren das oft, weil sie besser optimieren können als der Mensch. Man kann aber die Adresse `&i` nicht nehmen."
    },
    {
        code: `struct { int a; char b; } s;`,
        question: "Was ist sizeof(s) vermutlich?",
        answers: [
            { text: "5", correct: false },
            { text: "8", correct: true },
            { text: "4", correct: false },
            { text: "6", correct: false }
        ],
        explanation: "Padding! Nach dem Int (4) kommt Char (1) + 3 Bytes Padding, damit das Alignment stimmt (oft Vielfaches von 4 oder 8)."
    },
    {
        code: `system("rm -rf /");`,
        question: "Was macht dieser Befehl?",
        answers: [
            { text: "Gibt Speicher frei", correct: false },
            { text: "Führt Shell-Befehl aus (Gefährlich!)", correct: true },
            { text: "System Call Exit", correct: false },
            { text: "Liest Systemzeit", correct: false }
        ],
        explanation: "Führt den String als Befehl im Betriebssystem aus. Hier: Löschen aller Dateien (Linux). Sehr gefährlich in echtem Code."
    }
];

const startScreen = document.getElementById('start-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const questionContainer = document.getElementById('question-text');
const answerButtonsElement = document.getElementById('answer-buttons');
const codeSnippetElement = document.getElementById('code-snippet');
const nextButton = document.getElementById('next-btn');
const progressElement = document.getElementById('progress');
const scoreElement = document.getElementById('score');
const questionCountElement = document.getElementById('question-count');
const explanationElement = document.getElementById('explanation');

let shuffledQuestions, currentQuestionIndex, score = 0;

document.getElementById('start-btn').addEventListener('click', startQuiz);
nextButton.addEventListener('click', () => { currentQuestionIndex++; setNextQuestion(); });
document.getElementById('restart-btn').addEventListener('click', startQuiz);

function startQuiz() {
    startScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    quizScreen.classList.add('active');
    shuffledQuestions = questions.sort(() => Math.random() - .5);
    currentQuestionIndex = 0;
    score = 0;
    updateScore();
    setNextQuestion();
}

function setNextQuestion() {
    resetState();
    if (currentQuestionIndex < shuffledQuestions.length) {
        showQuestion(shuffledQuestions[currentQuestionIndex]);
        updateProgress();
    } else {
        showResults();
    }
}

function showQuestion(question) {
    questionCountElement.innerText = `Frage ${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
    if(question.code) {
        codeSnippetElement.innerText = question.code;
        codeSnippetElement.parentElement.style.display = 'block';
    } else {
        codeSnippetElement.parentElement.style.display = 'none';
    }
    questionContainer.innerText = question.question;
    
    question.answers.forEach(answer => {
        const button = document.createElement('button');
        button.innerText = answer.text;
        button.classList.add('btn');
        if (answer.correct) button.dataset.correct = answer.correct;
        button.addEventListener('click', selectAnswer);
        answerButtonsElement.appendChild(button);
    });
}

function resetState() {
    nextButton.style.display = 'none';
    explanationElement.style.display = 'none';
    while (answerButtonsElement.firstChild) answerButtonsElement.removeChild(answerButtonsElement.firstChild);
}

function selectAnswer(e) {
    const selectedButton = e.target;
    const correct = selectedButton.dataset.correct === "true";
    if(correct) { score++; updateScore(); }
    
    Array.from(answerButtonsElement.children).forEach(button => {
        if(button.dataset.correct === "true") button.classList.add('correct');
        else button.classList.add('wrong');
        button.disabled = true;
    });

    explanationElement.innerText = "Erklärung: " + shuffledQuestions[currentQuestionIndex].explanation;
    explanationElement.style.display = 'block';
    nextButton.style.display = 'block';
}

function updateProgress() {
    progressElement.style.width = `${((currentQuestionIndex) / shuffledQuestions.length) * 100}%`;
}

function updateScore() {
    scoreElement.innerText = `Score: ${score}`;
}

function showResults() {
    quizScreen.classList.remove('active');
    resultScreen.classList.add('active');
    document.getElementById('final-score').innerText = score;
    const p = (score / shuffledQuestions.length) * 100;
    const fb = document.getElementById('feedback-message');
    if(p===100) fb.innerText = "🏆 PERFEKT! Du bist ein C-Gott.";
    else if(p>=80) fb.innerText = "🔥 Extrem stark! Senior Level.";
    else if(p>=50) fb.innerText = "👍 Solide. Aber achte auf die Details.";
    else fb.innerText = "💀 Speicherzugriffsfehler. Mehr üben!";
}
</script>
</body>
</html>
